name: Release

# Publishing a GitHub release attaches exactly two files to it: the Chrome zip (Chrome, Edge, Brave), and the Firefox
# build signed by Mozilla, which installs in any Firefox by opening it or dragging it into a window. Bump `version` in
# package.json first and tag the release with it (v0.1.1 for 0.1.1); Mozilla signs each version once.
#
# Signing needs an addons.mozilla.org API key (Tools > Manage API Keys) in the repository secrets AMO_JWT_ISSUER and
# AMO_JWT_SECRET. Without them, the unsigned Firefox zip is attached instead, for about:debugging.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and attach
    runs-on: ubuntu-latest
    permissions:
      # Only to attach the builds to the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Check the tag matches the version being built
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "The release is tagged $TAG, but package.json says $version. Tag it v$version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run zip && npm run zip:firefox
      - run: npx --yes web-ext@10.8.0 lint --source-dir .output/firefox-mv3 --warnings-as-errors
      # Unlisted: signed for installing from this release, not listed on addons.mozilla.org. web-ext is pinned and run
      # here only, never a dependency.
      - name: Sign the Firefox build with Mozilla
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: >-
          npx --yes web-ext@10.8.0 sign --channel=unlisted --source-dir .output/firefox-mv3
          --artifacts-dir .output/signed --upload-source-code .output/dev-null-plus-plus-*-sources.zip
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never written into the script, so a tag name cannot inject a command.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          version="$(node -p "require('./package.json').version")"
          chrome=".output/dev-null-plus-plus-$version-chrome.zip"
          # One Firefox file: the signed .xpi when Mozilla signed it, otherwise the unsigned zip.
          firefox=".output/dev-null-plus-plus-$version-firefox.zip"
          for signed in .output/signed/*.xpi; do
            firefox=".output/dev-null-plus-plus-$version-firefox.xpi"
            mv "$signed" "$firefox"
          done
          gh release upload "$TAG" "$chrome" "$firefox" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Write the download links and install steps on the release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          version="$(node -p "require('./package.json').version")"
          signed=(.output/dev-null-plus-plus-*-firefox.xpi)
          # docs/RELEASE_NOTES.md has the steps for a signed and an unsigned Firefox file; keep the one that applies.
          if [ ${#signed[@]} -gt 0 ]; then
            firefox="dev-null-plus-plus-$version-firefox.xpi"; drop=unsigned; keep=signed
          else
            firefox="dev-null-plus-plus-$version-firefox.zip"; drop=signed; keep=unsigned
          fi
          sed -e "s/{{version}}/$version/g" -e "s#{{repo}}#$GITHUB_REPOSITORY#g" -e "s/{{firefox_file}}/$firefox/g" \
            -e "\|<!-- firefox:$drop -->|,\|<!-- /firefox:$drop -->|d" \
            -e "\|<!-- firefox:$keep -->|d" -e "\|<!-- /firefox:$keep -->|d" \
            docs/RELEASE_NOTES.md > .output/steps.md
          # Anything written when publishing stays, above the steps.
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if ! grep -q '^## Download' <<<"$body"; then
            : > .output/notes.md
            if [ -n "$body" ]; then
              printf '%s\n\n' "$body" > .output/notes.md
            fi
            cat .output/steps.md >> .output/notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file .output/notes.md
          fi

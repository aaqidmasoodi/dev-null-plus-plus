name: CI

on:
  push:
    branches: [main]
  pull_request:
  # dev-null.sh deploys many times a day. Run the live suite daily so an upstream change that breaks the extension is
  # caught here, not by users.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs, so a moved or compromised tag cannot change what runs. Dependabot bumps them.
jobs:
  check:
    name: Type-check, lint, format, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: .output/*.zip
          # .output is a dot-directory, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    name: End-to-end against live dev-null.sh (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Split over four machines at once, which is most of the time CI takes.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # The runner already has Chromium's system libraries, so only the browser is fetched, and kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results

  firefox:
    name: Firefox build, Mozilla's lint, and a smoke test in Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:firefox
      # The checks Mozilla runs before signing. web-ext is not a dependency: it brings in Android tooling with a known
      # advisory, so it is run here, pinned, and never shipped.
      - run: npx --yes web-ext@10.8.0 lint --source-dir .output/firefox-mv3 --warnings-as-errors
      # The runner comes with Firefox and geckodriver.
      - run: npm run test:e2e:firefox
